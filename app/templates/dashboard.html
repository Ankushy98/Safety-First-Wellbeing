<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wellbeing Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #263238;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2ff;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 Wellbeing Dashboard</h1>

    <form id="journalForm">

        <label>User ID</label>
        <input type="number" id="user_id" value="1" required>

        <label>Mood (1 to 5)</label>
        <input type="number" id="mood" min="1" max="5" required>

        <label>Journal Text</label>
        <textarea id="text" rows="5" required></textarea>

        <button type="submit">Submit Journal</button>

    </form>

    <div id="result">Result will appear here...</div>
    <h2>📊 Mood Summary</h2>

<button type="button" onclick="loadSummary()">
    View Mood Summary
</button>

<div id="summary"></div>
    <button type="button" onclick="loadHistory()">
    View Journal History
</button>

<div id="history"></div>

</div>

<script>
    document.getElementById("journalForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const user_id = Number(document.getElementById("user_id").value);
        const mood = Number(document.getElementById("mood").value);
        const text = document.getElementById("text").value;

        const resultBox = document.getElementById("result");

        resultBox.textContent = "Processing...";

        try {
            const response = await fetch("/journal/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: user_id,
                    mood: mood,
                    text: text
                })
            });

            const data = await response.json();

            resultBox.textContent = JSON.stringify(data, null, 2);

        } catch (error) {
            resultBox.textContent = "Error: " + error.message;
        }

    });

    async function loadHistory() {

    const user_id = document.getElementById("user_id").value;
    const historyBox = document.getElementById("history");

    historyBox.textContent = "Loading history...";

    async function loadSummary() {

    const user_id = document.getElementById("user_id").value;
    const summaryBox = document.getElementById("summary");

    summaryBox.textContent = "Loading summary...";

    try {
        const response = await fetch(`/journal/summary/${user_id}`);
        const data = await response.json();

        if (!response.ok) {
            summaryBox.textContent = "Error loading summary";
            return;
        }

        summaryBox.innerHTML = `
            <p><strong>Total Journals:</strong> ${data.total_entries}</p>
            <p><strong>Average Mood:</strong> ${data.average_mood}</p>
            <p><strong>Risk Counts:</strong></p>
            <pre>${JSON.stringify(data.risk_counts, null, 2)}</pre>
        `;

    } catch (error) {
        summaryBox.textContent = "Error: " + error.message;
    }
}

    try {
        const response = await fetch(`/journal/${user_id}`);
        const data = await response.json();

        historyBox.textContent = JSON.stringify(data, null, 2);

    } catch (error) {
        historyBox.textContent = "Error: " + error.message;
    }
}
</script>

</body>
</html>
